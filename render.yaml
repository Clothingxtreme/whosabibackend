services:
  - type: web
    name: whosabi-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
      - key: Jwt__Issuer
        value: WhoSabi.Api
      - key: Jwt__Audience
        value: WhoSabi.Client

