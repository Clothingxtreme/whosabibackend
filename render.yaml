services:
  - type: web
    name: whosabi-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: whosabi-db
          property: connectionString
      - key: Jwt__SigningKey
        generateValue: true
      - key: Jwt__Issuer
        value: WhoSabi.Api
      - key: Jwt__Audience
        value: WhoSabi.Client

databases:
  - name: whosabi-db
    plan: free
    databaseName: whosabi
    user: whosabi
