name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: whosabi_test
          POSTGRES_PASSWORD: test_only_not_production
          POSTGRES_DB: whosabi_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: Host=localhost;Port=5432;Database=whosabi_test;Username=whosabi_test;Password=test_only_not_production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/WhoSabi.Api.Tests/WhoSabi.Api.Tests.csproj -c Release
      - run: dotnet publish src/WhoSabi.Api/WhoSabi.Api.csproj -c Release -o publish
